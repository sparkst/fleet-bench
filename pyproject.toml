[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetbench"
version = "0.1.0"
description = "Parallel, rate-limit-aware benchmark of coding harnesses and models on public verifiable datasets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fleetbench = "bench:main"

[tool.setuptools]
py-modules = ["bench"]

[tool.setuptools.packages.find]
include = ["fleetbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
